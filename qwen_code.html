<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PythonCamp  Полный курс Python с нуля</title>
<meta name="description" content="Интерактивный курс Python в стиле freeCodeCamp: теория, задания, запуск кода прямо в браузере, сертификат.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<style>
:root{
  --bg:#0b0b1c; --panel:#13132a; --panel2:#1a1a36; --panel3:#212146;
  --border:#2a2a4e; --border2:#36365f;
  --text:#e9e9f5; --muted:#9c9cbb; --dim:#6d6d90;
  --accent:#ffd33d; --accent-ink:#1a1400;
  --green:#3ddc84; --red:#ff5c72; --blue:#6fb3ff; --purple:#c792ea; --orange:#e8a04c;
  --mono:"Cascadia Code",Consolas,"JetBrains Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.6;
  overflow:hidden;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#33335e;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#45457a}
button{font-family:inherit;cursor:pointer}
.btn{
  background:var(--panel3); color:var(--text); border:1px solid var(--border2);
  padding:8px 16px; border-radius:8px; font-size:14px; font-weight:600;
  transition:.15s; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{background:#292955; border-color:#4a4a85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover{background:#ffe36b}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:13px}
/* ===== Header ===== */
.topbar{
  height:54px; display:flex; align-items:center; gap:12px; padding:0 14px;
  background:var(--panel); border-bottom:1px solid var(--border);
  position:relative; z-index:30;
}
.burger{display:none; background:none;border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:6px 10px;font-size:16px}
.logo{font-size:19px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.logo span{color:var(--accent)}
.topbar-mid{flex:1;display:flex;align-items:center;gap:12px;max-width:520px;margin:0 auto}
.progresswrap{flex:1;height:12px;background:var(--panel2);border:1px solid var(--border);border-radius:99px;overflow:hidden}
.progressbar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ff9d5c);border-radius:99px;transition:width .4s ease}
.progresslabel{font-size:13px;font-weight:700;color:var(--accent);min-width:38px;text-align:right}
.tools{display:flex;align-items:center;gap:8px}
.engine-dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--dim);flex:none}
.engine-dot.loading{background:var(--blue);animation:pulse 1.2s infinite}
.engine-dot.ok{background:var(--green)}
.engine-dot.err{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
/* ===== Layout ===== */
.layout{display:flex;height:calc(100vh - 54px)}
.sidebar{
  width:300px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  overflow-y:auto;padding-bottom:30px;
}
.sidebar-head{position:sticky;top:0;background:var(--panel);padding:14px 14px 10px;border-bottom:1px solid var(--border);z-index:2}
.sidebar-head h2{font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.sidebar-head .cnt{font-size:12px;color:var(--dim);margin-top:2px}
nav.chapters{padding:8px}
.chapter{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--panel2)}
.chapter>summary{
  list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:8px;
  font-weight:700;font-size:14px;user-select:none;
}
.chapter>summary::-webkit-details-marker{display:none}
.chapter>summary:hover{background:var(--panel3)}
.chapter>summary .ch-num{background:var(--panel3);border:1px solid var(--border2);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--accent)}
.chapter>summary .ch-count{margin-left:auto;font-size:12px;color:var(--dim);font-weight:400}
.chapter .ch-body{padding:4px 6px 8px}
.lesson-item{
  width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--muted);
  padding:6px 10px 6px 14px;border-radius:8px;font-size:14px;display:flex;gap:8px;align-items:baseline;
}
.lesson-item:hover{background:var(--panel3);color:var(--text)}
.lesson-item.current{background:var(--panel3);border-color:var(--border2);color:var(--text)}
.lesson-item .li-ico{flex:none;width:18px;text-align:center;color:var(--dim)}
.lesson-item.done .li-ico{color:var(--green)}
.lesson-item.current .li-ico{color:var(--accent)}
.lesson-item.done{color:#b8b8d8}
.lesson-item .li-title{line-height:1.35}
.main{flex:1;overflow-y:auto}
.main-inner{max-width:860px;margin:0 auto;padding:26px 22px 60px}
/* ===== Lesson ===== */
.crumb{font-size:13px;color:var(--dim);margin-bottom:6px}
.crumb b{color:var(--muted)}
h1.lesson-title{font-size:28px;line-height:1.25;margin-bottom:4px}
.lesson-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:13px;margin-bottom:18px}
.lesson-meta .pill{border:1px solid var(--border);background:var(--panel2);border-radius:99px;padding:2px 10px}
.lesson-body{margin-top:6px}
.blk{margin:16px 0}
.blk h3{font-size:19px;margin:26px 0 8px;color:var(--text)}
.blk p{margin:10px 0;color:#d8d8ea}
.blk p b, .blk p strong{color:var(--text)}
.blk li{margin:5px 0 5px 26px;color:#d8d8ea}
.blk .hl-inline{background:var(--panel3);border:1px solid var(--border);padding:1px 6px;border-radius:5px;font-family:var(--mono);font-size:.88em;color:var(--accent)}
.codeblock{position:relative;background:#0e0e20;border:1px solid var(--border);border-radius:10px;margin:12px 0;overflow:hidden}
.codeblock .cb-head{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--panel2);border-bottom:1px solid var(--border);font-size:12px;color:var(--dim);font-family:var(--mono)}
.codeblock pre{padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55;color:#e6e6f2}
.codeblock .copy-btn{background:none;border:1px solid var(--border2);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:11px}
.codeblock .copy-btn:hover{color:var(--text);border-color:var(--dim)}
.callout{border-radius:10px;padding:12px 14px;margin:14px 0;font-size:14.5px;border:1px solid;display:flex;gap:10px}
.callout .co-ico{font-size:18px;flex:none}
.callout.info{background:rgba(111,179,255,.08);border-color:rgba(111,179,255,.35);color:#cfe4ff}
.callout.warn{background:rgba(255,213,61,.07);border-color:rgba(255,213,61,.35);color:#ffe9a8}
.callout.tip{background:rgba(61,220,132,.07);border-color:rgba(61,220,132,.35);color:#c8f5da}
.callout.danger{background:rgba(255,92,114,.07);border-color:rgba(255,92,114,.35);color:#ffd5db}
/* ===== Tasks ===== */
.task{
  border:1px solid var(--border);border-radius:12px;background:var(--panel);
  margin:20px 0;overflow:hidden;
}
.task-head{
  display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;font-weight:700;
  background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;
}
.task-head .t-ico{font-size:15px}
.task-head .t-state{margin-left:auto;color:var(--dim);font-weight:600;letter-spacing:0}
.task-head.solved{color:var(--green)}
.task-prompt{padding:12px 14px 4px;font-size:15px;color:#ddddef}
.task-prompt p{margin:6px 0}
.task-prompt .hl-inline{background:var(--panel3);border:1px solid var(--border);padding:1px 6px;border-radius:5px;font-family:var(--mono);font-size:.88em;color:var(--accent)}
/* MCQ */
.mcq-options{padding:10px 14px 16px;display:flex;flex-direction:column;gap:8px}
.mcq-options .opt{
  text-align:left;background:var(--panel2);border:1px solid var(--border2);color:var(--text);
  border-radius:9px;padding:9px 13px;font-size:14.5px;line-height:1.45;transition:.12s;
}
.mcq-options .opt:hover{border-color:#5a5a95;background:var(--panel3)}
.mcq-options .opt .let{display:inline-block;min-width:26px;font-weight:800;color:var(--muted)}
.mcq-options .opt.correct{border-color:var(--green);background:rgba(61,220,132,.12);color:#d8ffe9}
.mcq-options .opt.correct .let{color:var(--green)}
.mcq-options .opt.wrong{border-color:var(--red);background:rgba(255,92,114,.1);animation:shake .3s}
.mcq-options .opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* Fill */
.fill-wrap{padding:4px 14px 16px}
.fill-code{font-family:var(--mono);font-size:14.5px;line-height:2;background:#0e0e20;border:1px solid var(--border);border-radius:10px;padding:14px;overflow-x:auto;color:#e6e6f2}
.fill-code .blank{background:rgba(255,213,61,.15);border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700;padding:0 2px}
.fill-input{
  width:100%;margin-top:12px;background:var(--panel2);border:1px solid var(--border2);color:var(--text);
  border-radius:9px;padding:10px 13px;font-family:var(--mono);font-size:15px;outline:none;transition:.15s;
}
.fill-input:focus{border-color:var(--accent)}
/* Editor */
.editor-wrap{padding:10px 14px 0}
.editor-box{
  position:relative;background:#0d0d1f;border:1px solid var(--border);border-radius:10px;overflow:hidden;
}
.ed-row{display:flex}
.ed-gutter{
  flex:none;background:#101022;border-right:1px solid var(--border);color:#4c4c75;
  font-family:var(--mono);font-size:13.5px;line-height:1.55;text-align:right;padding:12px 8px 24px;
  user-select:none;overflow:hidden;min-width:38px;
}
.ed-inner{position:relative;flex:1}
.ed-hl{
  position:absolute;inset:0;margin:0;padding:12px 14px;overflow:hidden;pointer-events:none;
  font-family:var(--mono);font-size:13.5px;line-height:1.55;white-space:pre;color:#e6e6f2;
}
.ed-ta{
  position:absolute;inset:0;width:100%;height:100%;
  background:transparent;color:transparent;caret-color:#fff;
  border:none;outline:none;resize:none;overflow:auto;padding:12px 14px;
  font-family:var(--mono);font-size:13.5px;line-height:1.55;white-space:pre;tab-size:4;
}
.ed-ta::selection{background:rgba(111,179,255,.28)}
.tok-kw{color:var(--purple);font-weight:600}
.tok-str{color:var(--green)}
.tok-com{color:#5d5d85;font-style:italic}
.tok-num{color:var(--orange)}
.tok-bui{color:var(--blue)}
.ed-actions{padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ed-status{margin-left:auto;font-size:13px;color:var(--dim)}
.ed-console{
  margin:0 14px 14px;background:#08081a;border:1px solid var(--border);border-radius:10px;
  font-family:var(--mono);font-size:13.5px;min-height:0;display:none;
}
.ed-console.open{display:block}
.ed-console .con-head{padding:6px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.ed-console pre{margin:0;padding:12px;white-space:pre-wrap;word-break:break-word;color:#d5d5e8;max-height:260px;overflow-y:auto}
.ed-console pre.err{color:var(--red)}
.ed-console .con-clear{background:none;border:none;color:var(--dim);font-size:11px}
.ed-console .con-clear:hover{color:var(--text)}
/* Task result */
.task-result{display:none;margin:0 14px 14px;border-radius:10px;padding:12px 14px;font-size:14.5px;border:1px solid}
.task-result.show{display:block;animation:fadein .25s}
.task-result.pass{background:rgba(61,220,132,.1);border-color:var(--green);color:#d8ffe9}
.task-result.fail{background:rgba(255,92,114,.09);border-color:var(--red);color:#ffd5db}
.task-result.error{background:rgba(255,92,114,.09);border-color:var(--red);color:#ffd5db}
.task-result h4{font-size:15px;margin-bottom:6px}
.task-result pre{margin-top:8px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.25);border-radius:8px;padding:10px}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
/* Lesson nav */
.lesson-nav{
  display:flex;align-items:center;gap:10px;margin-top:30px;padding-top:18px;border-top:1px solid var(--border);
}
.lesson-nav .nav-state{flex:1;text-align:center;font-size:13px;color:var(--dim)}
.lesson-nav .nav-state.locked{color:var(--dim)}
.lesson-nav .nav-state.ok{color:var(--green);font-weight:700}
/* Banner */
.banner{
  display:none;align-items:flex-start;gap:12px;margin:14px 0;padding:14px 16px;border-radius:12px;
  border:1px solid rgba(255,92,114,.4);background:rgba(255,92,114,.08);font-size:14.5px;
}
.banner.show{display:flex}
.banner code{font-family:var(--mono);background:rgba(0,0,0,.3);padding:1px 6px;border-radius:5px;color:var(--accent)}
/* Toasts */
#toasts{position:fixed;top:64px;right:16px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--panel3);border:1px solid var(--border2);border-left:4px solid var(--accent);
  padding:11px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4);
  animation:slidein .25s;max-width:340px;
}
.toast.good{border-left-color:var(--green)}
.toast.bad{border-left-color:var(--red)}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1}}
/* Modal / Certificate */
.modal-overlay{
  position:fixed;inset:0;background:rgba(5,5,15,.75);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;
}
.modal-overlay.hidden{display:none}
.modal{max-width:780px;width:100%}
.cert{
  background:linear-gradient(160deg,#fdfbf3,#f7f2e0);color:#2a2416;border-radius:8px;
  padding:36px 42px;text-align:center;border:10px double #c9a227;box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.cert-emoji{font-size:52px}
.cert-title{font-size:32px;font-weight:800;letter-spacing:5px;text-transform:uppercase;color:#8a6d14;margin-top:6px}
.cert-sub{font-size:14px;color:#7a6a45;margin-top:4px}
.cert-name{
  font-size:34px;font-weight:800;margin:26px 0 4px;color:#17120a;
  border-bottom:2px solid #c9a227;display:inline-block;padding:0 28px 8px;
}
.cert-course{font-size:17px;color:#5a4c26;margin-top:10px}
.cert-meta{font-size:13px;color:#8a7a50;margin-top:22px}
.cert-sign{display:flex;justify-content:space-between;margin-top:34px;font-size:13px;color:#5a4c26}
.cert-sign .s-line{border-top:1px solid #b99b3e;padding-top:6px;min-width:160px}
.modal-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.modal-actions input{
  flex:1;min-width:220px;background:var(--panel2);border:1px solid var(--border2);color:var(--text);
  border-radius:9px;padding:10px 13px;font-size:15px;outline:none;
}
.modal-actions input:focus{border-color:var(--accent)}
/* responsive */
@media (max-width:900px){
  .burger{display:block}
  .sidebar{position:fixed;left:0;top:54px;bottom:0;z-index:40;transform:translateX(-105%);transition:transform .25s ease;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .sidebar.open{transform:translateX(0)}
  .tools .btn.text-hideable{display:none}
}
@media print{
  body{overflow:visible;background:#fff}
  body>*:not(.modal-overlay){display:none!important}
  .modal-overlay{position:static;display:block;background:none;padding:0}
  .modal{max-width:100%}
  .modal-actions{display:none}
  .cert{border-width:14px}
  @page{size:A4 landscape;margin:0}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="burger" id="burgerBtn" title="Меню курса">☰</button>
  <div class="logo">🐍 Python<span>Camp</span></div>
  <div class="topbar-mid">
    <div class="progresswrap"><div class="progressbar" id="progressBar"></div></div>
    <span class="progresslabel" id="progressLabel">0%</span>
  </div>
  <div class="tools">
    <span class="engine-dot" id="engineDot" title="Python-движок: подключается"></span>
    <button class="btn primary small text-hideable" id="certBtn" disabled title="Сертификат откроется после прохождения всего курса">🎓 Сертификат</button>
    <button class="btn ghost small" id="resetBtn" title="Сбросить весь прогресс">↺</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <h2>Программа курса</h2>
      <div class="cnt" id="sidebarCount"></div>
    </div>
    <nav class="chapters" id="curriculum"></nav>
  </aside>
  <main class="main" id="main">
    <div class="main-inner" id="lessonView"></div>
  </main>
</div>

<div id="toasts"></div>

<div class="modal-overlay hidden" id="certModal">
  <div class="modal">
    <div class="cert">
      <div class="cert-emoji">🐍</div>
      <div class="cert-title">Сертификат</div>
      <div class="cert-sub">об успешном прохождении онлайн-курса</div>
      <div class="cert-name" id="certName">Имя Фамилия</div>
      <div class="cert-course">«Полный курс Python с нуля» · 11 глав · 49 уроков</div>
      <div class="cert-meta" id="certDate">PythonCamp · октябрь 2026</div>
      <div class="cert-sign">
        <div class="s-line">Преподаватель курса</div>
        <div class="s-line">PythonCamp</div>
      </div>
    </div>
    <div class="modal-actions">
      <input id="certNameInput" maxlength="60" placeholder="Твоё имя для сертификата">
      <button class="btn primary" id="certPrintBtn">🖨 Распечатать / Сохранить PDF</button>
      <button class="btn ghost" id="certCloseBtn">Закрыть</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================================================================
   PythonCamp  single-file freeCodeCamp-style Python course
   ================================================================ */

/* ---------- Course data (injected below, one const per chapter) ---------- */
const COURSE = [
{
  title: "Введение в Python",
  emoji: "🚀",
  lessons: [
    {
      id: "l1-1",
      title: "Что такое Python и как его запускать",
      content: [
        { t: "p", h: "Python  один из самых популярных языков программирования в мире. Его используют в веб-разработке, анализе данных, искусственном интеллекте, автоматизации и науке. Секрет популярности  простой и читаемый синтаксис: код на Python часто выглядит почти как псевдокод." },
        { t: "callout", kind: "info", icon: "🐍", h: "На этой платформе Python выполняется <b>прямо в браузере</b> (технология Pyodide  полноценный интерпретатор, собранный в WebAssembly). Твои программы будут работать на настоящем Python со всей стандартной библиотекой." },
        { t: "h3", h: "Установка на свой компьютер" },
        { t: "p", h: "Чтобы запускать Python на своём ПК, зайди на <code class=\"hl-inline\">python.org/downloads</code>, скачай и установи последнюю версию. При установке на Windows обязательно отметь галочку <b>Add Python to PATH</b>. Проверить установку можно командой <code class=\"hl-inline\">python --version</code>." },
        { t: "h3", h: "Способы запуска программ" },
        { t: "list", items: [
          "<b>Интерактивный режим</b>  набери <code class=\"hl-inline\">python</code> в терминале: команды выполняются сразу, построчно;",
          "<b>Скрипт</b>  сохрани код в файл с расширением <code class=\"hl-inline\">.py</code> и запусти командой <code class=\"hl-inline\">python имя_файла.py</code>;",

/* ---------- Storage ---------- */
const LS_KEY = "pycamp:v1";
let store = { tasks: {}, name: "" };
try { store = Object.assign(store, JSON.parse(localStorage.getItem(LS_KEY) || "{}")); } catch (e) {}
function saveStore(){ try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {} }

function taskKey(lid, ti){ return lid + ":" + ti; }
function isTaskSolved(lid, ti){ return !!store.tasks[taskKey(lid, ti)]; }
function solveTask(lid, ti){
  store.tasks[taskKey(lid, ti)] = 1; saveStore(); refreshProgress();
}
const FLAT = (function(){
  const out = [];
  COURSE.forEach((ch, ci) => ch.lessons.forEach((l, li) => out.push({ ch, ci, l, li })));
  return out;
})();
function lessonDone(li){ return li.tasks.every((t, ti) => isTaskSolved(li.id, ti)); }
function totalLessons(){ return FLAT.length; }
function doneLessons(){ return FLAT.filter(x => lessonDone(x.l)).length; }
function allDone(){ return doneLessons() === FLAT.length; }

/* ---------- Small utils ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function toast(msg, kind){
  const t = document.createElement("div");
  t.className = "toast" + (kind ? " " + kind : "");
  t.innerHTML = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .4s"; setTimeout(() => t.remove(), 400); }, 3200);
}
function copyText(text){
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast("Пример скопирован 📋"), () => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Пример скопирован 📋"); } catch (e) {}
  ta.remove();
}

/* ---------- Syntax highlighting ---------- */
const TOKEN_RE = /("""[\s\S]*?"""|'(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|#[^\n]*|\b(?:False|None|True|and|as|assert|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield|match|case)\b|\b\d+(?:\.\d+)?\b|\b(?:print|len|range|int|str|float|list|dict|set|tuple|input|type|sum|max|min|abs|round|sorted|enumerate|zip|open|map|filter|bool|repr|isinstance|super|ord|chr|pow|divmod|all|any|reversed|format|help|dir|id|hash|bytes|bytearray|frozenset|complex|object|staticmethod|classmethod|property)\b)/g;
function highlight(code){
  const out = []; let last = 0, m;
  const re = new RegExp(TOKEN_RE.source, "g");
  while ((m = re.exec(code))){
    out.push(esc(code.slice(last, m.index)));
    let cls = "tok-num";
    const t = m[0];
    if (t[0] === "'" || t[0] === '"') cls = "tok-str";
    else if (t[0] === "#") cls = "tok-com";
    else if (/^\d/.test(t)) cls = "tok-num";
    else if (/\b(?:print|len|range|int|str|float|list|dict|set|tuple|input|type|sum|max|min|abs|round|sorted|enumerate|zip|open|map|filter|bool|repr|isinstance|super|ord|chr|pow|divmod|all|any|reversed|format|help|dir|id|hash|bytes|bytearray|frozenset|complex|object|staticmethod|classmethod|property)\b/.test(t)) cls = "tok-bui";
    else cls = "tok-kw";
    out.push('<span class="' + cls + '">' + esc(t) + "</span>");
    last = m.index + t.length;
  }
  out.push(esc(code.slice(last)));
  return out.join("");
}

/* ---------- Code editor (textarea + highlight overlay) ---------- */
function createEditor(container, starter){
  container.innerHTML =
    '<div class="ed-row">' +
      '<div class="ed-gutter"></div>' +
      '<div class="ed-inner">' +
        '<pre class="ed-hl" aria-hidden="true"></pre>' +
        '<textarea class="ed-ta" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" wrap="off"></textarea>' +
      '</div>' +
    '</div>';
  const ta = container.querySelector(".ed-ta");
  const hl = container.querySelector(".ed-hl");
  const gutter = container.querySelector(".ed-gutter");
  const render = () => {
    hl.innerHTML = highlight(ta.value);
    const n = ta.value.split("\n").length;
    let g = "";
    for (let i = 1; i <= n; i++) g += i + "\n";
    gutter.textContent = g;
    syncScroll();
  };
  function syncScroll(){
    hl.style.transform = "translate(-" + ta.scrollLeft + "px,-" + ta.scrollTop + "px)";
    gutter.style.transform = "translateY(-" + ta.scrollTop + "px)";
  }
  ta.addEventListener("input", render);
  ta.addEventListener("scroll", syncScroll);
  ta.addEventListener("keydown", e => {
    if (e.key === "Tab"){
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 4;
      render();
    }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      const runEvt = new CustomEvent("runRequest");
      container.dispatchEvent(runEvt);
    }
  });
  ta.value = starter;
  render();
  return {
    getValue: () => ta.value,
    setValue: v => { ta.value = v; render(); },
    focus: () => { ta.focus(); const n = ta.value.length; ta.setSelectionRange(n, n); },
    clearConsole: () => {}
  };
}

/* ---------- Pyodide worker ---------- */
const PYODIDE_INDEX = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
const WORKER_SRC =
"var py = null, buf = null;\n" +
"self.onmessage = async function(e){\n" +
"  var d = e.data;\n" +
"  if (d.type === 'ping') {\n" +
"    try {\n" +
"      if (!py) py = await loadPyodide({ indexURL: '" + PYODIDE_INDEX + "' });\n" +
"      py.setStdout({ batched: function(s){ if (buf) buf.push(s); } });\n" +
"      postMessage({ type: 'pong', ok: true });\n" +
"    } catch (err) {\n" +
"      postMessage({ type: 'pong', ok: false, error: String((err && err.message) || err) });\n" +
"    }\n" +
"  } else if (d.type === 'exec') {\n" +
"    buf = [];\n" +
"    try {\n" +
"      if (!py) py = await loadPyodide({ indexURL: '" + PYODIDE_INDEX + "' });\n" +
"      py.setStdout({ batched: function(s){ if (buf) buf.push(s); } });\n" +
"      var G = py.runPython('dict(globals())');\n" +
"      try {\n" +
"        py.runPython(d.script, { globals: G });\n" +
"        var checks = null;\n" +
"        if (G.has('__checks')) checks = G.get('__checks').toJs();\n" +
"        var out = '';\n" +
"        if (G.has('__out')) out = String(G.get('__out').getvalue());\n" +
"        else out = buf.join('');\n" +
"        postMessage({ type: 'done', id: d.id, ok: true, checks: checks, out: out });\n" +
"      } catch (err) {\n" +
"        var out2 = '';\n" +
"        try { if (G.has('__out')) out2 = String(G.get('__out').getvalue()); } catch (e2) {}\n" +
"        postMessage({ type: 'done', id: d.id, ok: false, error: String((err && err.message) || err), out: out2 });\n" +
"      }\n" +
"    } catch (err) {\n" +
"      postMessage({ type: 'done', id: d.id, ok: false, fatal: true, error: String((err && err.message) || err) });\n" +
"    }\n" +
"  }\n" +
"};\n";

let worker = null, workerPending = false, opId = 0, opTimers = {};
const engineDot = $("#engineDot");
function spawnWorker(){
  if (worker) { try { worker.terminate(); } catch (e) {} }
  worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" })));
  worker.onmessage = ev => {
    const d = ev.data;
    if (d.type === "pong"){
      engineDot.className = "engine-dot " + (d.ok ? "ok" : "err");
      engineDot.title = d.ok ? "Python-движок готов" : "Python-движок недоступен: " + (d.error || "нет сети");
      if (!d.ok) showEngineBanner(d.error);
    } else if (d.type === "done"){
      clearTimeout(opTimers[d.id]); delete opTimers[d.id];
      if (opCallbacks[d.id]) { opCallbacks[d.id](d); delete opCallbacks[d.id]; }
      if (workerPending){ workerPending = false; spawnWorker(); }
    }
  };
}
let opCallbacks = {};
function initEngine(){
  engineDot.className = "engine-dot loading";
  spawnWorker();
  worker.postMessage({ type: "ping" });
}
function execPython(script, timeoutMs){
  return new Promise((resolve, reject) => {
    if (!worker || workerPending){ initEngine(); }
    const id = ++opId;
    const timer = setTimeout(() => {
      delete opCallbacks[id];
      toast("<b>Превышено время выполнения.</b> Возможно, в коде бесконечный цикл. Работа прервана.", "bad");
      workerPending = true;
      opTimers[id] && clearTimeout(opTimers[id]);
      reject(new Error("timeout"));
    }, timeoutMs || 20000);
    opTimers[id] = timer;
    opCallbacks[id] = d => {
      if (d.fatal){
        engineDot.className = "engine-dot err";
        engineDot.title = "Python-движок недоступен";
        showEngineBanner(d.error);
        clearTimeout(opTimers[id]);
        resolve({ ok: false, fatal: true, error: d.error });
      } else resolve(d);
    };
    worker.postMessage({ type: "exec", id: id, script: script });
  });
}
const engineBanner = document.createElement("div");
engineBanner.className = "banner";
function showEngineBanner(err){
  if (engineBanner.classList.contains("show")) return;
  engineBanner.classList.add("show");
  engineBanner.innerHTML =
    '<div class="co-ico">⚠</div><div><b>Не удалось запустить Python-движок.</b><br>' +
    "Для выполнения кода открой файл через локальный сервер и проверь интернет (Pyodide грузится с CDN).<br>" +
    '<code>python -m http.server 8000</code> затем <code>http://localhost:8000</code><br>' +
    "Викторины и задания-вставки работают и без сервера. Причина: " + esc(err) +
    '</div><button class="btn small" style="margin-left:auto" onclick="document.querySelector(\'.banner\').classList.remove(\'show\')">✕</button>';
  $("#lessonView").prepend(engineBanner);
}

/* ---------- Task script composition ---------- */
function wrapForCheck(userCode, setup, tests){
  const head = "import io as __io, sys as __sys\n__out = __io.StringIO()\n__sys.stdout = __out\n";
  let body = head;
  if (setup) body += "\n" + setup + "\n";
  body += "\n" + userCode + "\n";
  body += "\n__checks = []\n";
  tests.forEach(t => {
    body += "try:\n    " + String(t.t).split("\n").join("\n    ") + "\n    __checks.append(('ok',''))\n";
    body += "except Exception as __e:\n    __checks.append(('fail', type(__e).__name__ + ': ' + str(__e)))\n";
  });
  return body;
}
function cleanTrace(msg){
  const lines = String(msg).replace(/\r/g, "").split("\n");
  for (let i = lines.length - 1; i >= 0; i--){
    const ln = lines[i].trim();
    if (ln && /^\w+(Error|Exception|Warning|Exit): /.test(ln)) return ln;
  }
  return String(msg).slice(0, 400);
}

/* ---------- Rendering: tasks ---------- */
function renderTasks(lesson, host){
  lesson.tasks.forEach((task, ti) => {
    const solved = isTaskSolved(lesson.id, ti);
    const d = document.createElement("div");
    d.className = "task";
    d.dataset.ti = ti;
    d.innerHTML = '<div class="task-head"><span class="t-ico">' + (task.type === "mcq" ? "❓" : task.type === "fill" ? "✍" : "💻") + '</span><span>Задание ' + (ti + 1) + '</span><span class="t-state"></span></div>';
    const prompt = document.createElement("div");
    prompt.className = "task-prompt";
    prompt.innerHTML = task.prompt;
    d.appendChild(prompt);
    const result = document.createElement("div");
    result.className = "task-result";
    d.appendChild(result);

    if (task.type === "mcq"){
      const box = document.createElement("div");
      box.className = "mcq-options";
      const letters = ["A", "B", "C", "D", "E"];
      task.options.forEach((opt, oi) => {
        const b = document.createElement("button");
        b.className = "opt";
        b.innerHTML = '<span class="let">' + letters[oi] + ".</span> " + esc(opt);
        b.onclick = () => {
          if (oi === task.answer){
            b.classList.add("correct");
            box.querySelectorAll(".opt").forEach(x => x.disabled = true);
            setTaskResult(d, "pass", "✅ <b>Верно!</b> " + (task.explain || ""));
            markTaskSolved(lesson, ti, d);
          } else {
            b.classList.add("wrong");
            setTimeout(() => b.classList.remove("wrong"), 350);
            if (task.hint) setTaskResult(d, "fail", "❌ Не совсем. Подсказка: " + task.hint);
          }
        };
        box.appendChild(b);
      });
      d.appendChild(box);
    } else if (task.type === "fill"){
      const wrap = document.createElement("div");
      wrap.className = "fill-wrap";
      const pre = document.createElement("div");
      pre.className = "fill-code";
      pre.innerHTML = esc(task.code).replace(/_{3,}/g, '<span class="blank">___</span>');
      const input = document.createElement("input");
      input.className = "fill-input";
      input.placeholder = "Впиши пропущенное";
      input.addEventListener("keydown", e => { if (e.key === "Enter") checkFill(); });
      const act = document.createElement("div");
      act.className = "ed-actions";
      const btn = document.createElement("button");
      btn.className = "btn primary";
      btn.innerHTML = "✓ Проверить";
      btn.onclick = checkFill;
      act.appendChild(btn);
      wrap.appendChild(pre); wrap.appendChild(input); act; wrap.appendChild(act);
      d.appendChild(wrap);
      function checkFill(){
        const norm = v => String(v || "").toLowerCase().replace(/[\s«»"']/g, "");
        const val = norm(input.value);
        const ok = (task.expected || []).some(x => norm(x) === val);
        if (ok){
          setTaskResult(d, "pass", "✅ <b>Верно!</b> " + (task.explain || ""));
          markTaskSolved(lesson, ti, d);
          input.disabled = true;
        } else if (val){
          setTaskResult(d, "fail", "❌ Не то. " + (task.hint || "Попробуй ещё раз."));
        }
      }
    } else if (task.type === "code"){
      const edWrap = document.createElement("div");
      edWrap.className = "editor-wrap";
      const editor = createEditor(edWrap, task.starter || "");
      const actions = document.createElement("div");
      actions.className = "ed-actions";
      const runBtn = document.createElement("button");
      runBtn.className = "btn";
      runBtn.innerHTML = "▶ Запустить";
      const checkBtn = document.createElement("button");
      checkBtn.className = "btn primary";
      checkBtn.innerHTML = "✓ Проверить";
      const resetBtn = document.createElement("button");
      resetBtn.className = "btn ghost small";
      resetBtn.title = "Вернуть исходный код";
      resetBtn.textContent = "↺";
      resetBtn.onclick = () => editor.setValue(task.starter || "");
      const status = document.createElement("span");
      status.className = "ed-status";
      actions.appendChild(runBtn); actions.appendChild(checkBtn); actions.appendChild(resetBtn); actions.appendChild(status);
      const consoleBox = document.createElement("div");
      consoleBox.className = "ed-console";
      consoleBox.innerHTML = '<div class="con-head"><span>Консоль</span><button class="con-clear">очистить</button></div><pre></pre>';
      consoleBox.querySelector(".con-clear").onclick = () => { consoleBox.querySelector("pre").textContent = ""; consoleBox.classList.remove("open"); };
      const conPre = consoleBox.querySelector("pre");
      d.appendChild(edWrap); d.appendChild(actions); d.appendChild(consoleBox);
      const setBusy = busy => {
        runBtn.disabled = busy; checkBtn.disabled = busy;
        status.innerHTML = busy ? '<span style="color:var(--blue)">⏳ выполняется</span>' : "";
      };
      const showConsole = (text, isErr) => {
        conPre.textContent = text;
        conPre.className = isErr ? "err" : "";
        consoleBox.classList.add("open");
      };
      edWrap.addEventListener("runRequest", () => run());
      function run(){
        setBusy(true);
        execPython(editor.getValue()).then(res => {
          setBusy(false);
          if (res.fatal) { showConsole("Движок недоступен. " + res.error, true); return; }
          if (res.ok) showConsole(res.out || "(программа ничего не вывела)");
          else showConsole(res.out ? res.out + "\n\n" + cleanTrace(res.error) : cleanTrace(res.error), true);
        }).catch(e => { setBusy(false); showConsole("Прервано: " + (e && e.message), true); });
      }
      function check(){
        setBusy(true);
        const script = wrapForCheck(editor.getValue(), task.setup, task.tests);
        execPython(script).then(res => {
          setBusy(false);
          if (res.fatal) { showConsole("Движок недоступен. " + res.error, true); return; }
          if (!res.ok){
            showConsole(res.out, false);
            setTaskResult(d, "error", "❌ <b>Ошибка в твоём коде:</b> " + esc(cleanTrace(res.error)) + (task.hint ? "<br><br>💡 " + task.hint : ""));
            return;
          }
          const checks = res.checks || [];
          const failed = checks.filter(c => c && c[0] !== "ok");
          if (checks.length && failed.length === 0){
            setTaskResult(d, "pass", "🎉 <b>Все проверки пройдены!</b> " + (task.explain || ""));
            markTaskSolved(lesson, ti, d);
            showConsole(res.out || "(вывод пуст)", false);
          } else if (checks.length){
            const first = failed[0];
            let msg = "❌ <b>Не всё верно.</b> " + esc(first[1]);
            const tIdx = checks.indexOf(first);
            if (task.tests[tIdx] && task.tests[tIdx].hint) msg += "<br><br>💡 " + task.tests[tIdx].hint;
            setTaskResult(d, "fail", msg);
            showConsole(res.out || "(вывод пуст)", false);
          } else {
            setTaskResult(d, "pass", "✅ <b>Готово!</b> " + (task.explain || ""));
            markTaskSolved(lesson, ti, d);
          }
        }).catch(e => { setBusy(false); showConsole("Прервано: " + (e && e.message), true); });
      }
      runBtn.onclick = run;
      checkBtn.onclick = check;
    }

    if (solved && task.type !== "code" && !result.classList.contains("pass")){
      d.querySelector(".task-head").classList.add("solved");
      d.querySelector(".t-state").innerHTML = "✅ решено";
    }
    host.appendChild(d);
  });
}
function setTaskResult(taskEl, kind, html){
  const r = taskEl.querySelector(".task-result");
  r.className = "task-result show " + kind;
  r.innerHTML = html;
}
function markTaskSolved(lesson, ti, taskEl){
  solveTask(lesson.id, ti);
  const head = taskEl.querySelector(".task-head");
  head.classList.add("solved");
  head.querySelector(".t-state").innerHTML = "✅ решено";
  const remaining = lesson.tasks.filter((t, i) => !isTaskSolved(lesson.id, i)).length;
  if (remaining === 0){
    toast("🎉 <b>Урок пройден!</b> «" + esc(lesson.title) + "»");
    updateLessonNav(lesson);
    renderCurriculum();
  } else {
    toast("✅ Задание выполнено! Осталось: " + remaining, "good");
  }
}

      const b = document.createElement("button");
      b.className = "lesson-item" + (ll.id === activeId ? " current" : "") + (lessonDone(ll) ? " done" : "");
      const ico = ll.id === activeId ? "▸" : (lessonDone(ll) ? "✓" : "○");
      b.innerHTML = '<span class="li-ico">' + ico + '</span><span class="li-title">' + esc(ll.title) + "</span>";
      const flatIdx = FLAT.findIndex(f => f.l.id === ll.id);
      b.onclick = () => { renderLesson(flatIdx); closeSidebar(); };
      body.appendChild(b);
    });
    details.appendChild(sum); details.appendChild(body);
    nav.appendChild(details);
  });
  const tl = totalLessons(), dl = doneLessons();
  $("#sidebarCount").textContent = "Пройдено уроков: " + dl + " из " + tl;
}
function refreshProgress(){
  const tl = totalLessons(), dl = doneLessons();
  const pct = Math.round(dl / tl * 100);
  $("#progressBar").style.width = pct + "%";
  $("#progressLabel").textContent = pct + "%";
  const certBtn = $("#certBtn");
  certBtn.disabled = !allDone();
  if (pct > 0 && pct < 100 && Math.random() < 0.01) toast("Прогресс: " + pct + "% 💪", "good");
}

/* ---------- Sidebar / top actions ---------- */
function closeSidebar(){ $("#sidebar").classList.remove("open"); }
$("#burgerBtn").onclick = () => $("#sidebar").classList.toggle("open");
$("#resetBtn").onclick = () => {
  if (confirm("Сбросить весь прогресс по курсу?")){
    store = { tasks: {}, name: "" };
    saveStore(); refreshProgress(); renderCurriculum();
    const cur = FLAT[currentIdx];
    renderLesson(currentIdx);
    toast("Прогресс сброшен.");
  }
};

/* ---------- Certificate ---------- */
$("#certBtn").onclick = openCert;
function openCert(){
  $("#certName").textContent = store.name || "Имя Фамилия";
  $("#certNameInput").value = store.name || "";
  const d = new Date();
  const months = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  $("#certDate").textContent = "PythonCamp · " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
  $("#certModal").classList.remove("hidden");
}
$("#certNameInput").addEventListener("input", e => {
  store.name = e.target.value.trim(); saveStore();
  $("#certName").textContent = store.name || "Имя Фамилия";
});
$("#certPrintBtn").onclick = () => window.print();
$("#certCloseBtn").onclick = () => $("#certModal").classList.add("hidden");
$("#certModal").addEventListener("click", e => { if (e.target === $("#certModal")) $("#certModal").classList.add("hidden"); });

/* ---------- Boot ---------- */
initEngine();
refreshProgress();
renderCurriculum();
// открываем первый непройденный урок
const firstUnfinished = FLAT.findIndex(f => !lessonDone(f.l));
renderLesson(firstUnfinished === -1 ? 0 : firstUnfinished);
</script>
</body>
